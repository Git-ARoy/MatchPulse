apiVersion: v1
kind: Service
metadata: { name: matchpulse-api }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: matchpulse-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: matchpulse-web }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: matchpulse-web }
  ports: [{ name: http, port: 80, targetPort: http }]
