apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchpulse-api
  labels: { app.kubernetes.io/name: matchpulse-api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app.kubernetes.io/name: matchpulse-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: matchpulse-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/git-aroy/matchpulse-api:latest
          ports: [{ containerPort: 8000, name: http }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          livenessProbe: { httpGet: { path: /api/v1/health/liveness, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /api/v1/health/readiness, port: http }, initialDelaySeconds: 5 }
          envFrom: [{ secretRef: { name: matchpulse-api-secrets, optional: true } }]
