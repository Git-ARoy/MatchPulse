apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matchpulse
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  tls: [{ hosts: [matchpulse.example.com], secretName: matchpulse-tls }]
  rules:
    - host: matchpulse.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: matchpulse-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: matchpulse-web, port: { name: http } } }
