version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MATCHPULSE_ENV=development
      - MATCHPULSE_LOG_LEVEL=INFO
      - MATCHPULSE_CORS_ORIGINS=http://localhost:3000
      # Optional AI/Cloud integrations (not required for local dev)
      # - FOUNDRY_PROJECT_ENDPOINT=
      # - FOUNDRY_MODEL=
      # - COSMOS_DB_ENDPOINT=
      # - COSMOS_DB_KEY=
      # - APPINSIGHTS_CONNECTION_STRING=
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    environment:
      - MATCHPULSE_API_URL=http://backend:8000
      - SIMULATOR_PORT=8050
    depends_on:
      - backend
